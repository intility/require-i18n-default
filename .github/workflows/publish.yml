name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          registry-url: https://npm.intility.com/
          scope: "@intility"
          cache: true
          cache-toolchain: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_INTILITY_COM_TOKEN }}

      - name: Run tests
        run: vp test

      - name: Build
        run: vp pack

      - name: Publish
        run: pnpm publish --access public
